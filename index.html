<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHO WANTS TO BE A BILLIONAIRE</title>
  <link rel="manifest" href="manifest.json"/>
    <link rel="icon" type="image/png" sizes="192x192" href="icon(2).png">
    <link rel="apple-touch-icon" href="icon(2).png">
  <style>
    /* Targeting the body tag directly without a dot fixes the background */
    body {
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      background: linear-gradient(135deg, green, #000089, darkblue);
      background-size: 300% 300%;
      animation: sparkleAnimation 8s ease infinite;
      font-family: system-ui, sans-serif;
    }
      
    @keyframes sparkleAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h1 {
      color: white;
      text-align: center;
    }

    /* Your custom dark blue cash button styling */
    .dark-blue-btn {
      background-color: #0B132B;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px 30px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .dark-blue-btn:hover {
      background-color: #1c2541;
      transform: translateY(-2px);
    }

    .loader {
      width: 18px; 
      height: 18px; 
      border: 3px solid rgba(255, 255, 255, 0.2); 
      border-top: 3px solid orange; 
      border-radius: 50%; 
      animation: spin 2s linear infinite; 
      display: none;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <h1>WHO WANTS TO BE A BILLIONAIRE &#128181;</h1>

  <!-- Interactive Button Container -->
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; position: fixed; bottom: 60px; width: 100%; left: 0;">
    
    <!-- Dark Blue Button with Cash Emoji integration -->
    <button type="button" 
            class="dark-blue-btn" 
            onclick="document.getElementById('loader1').style.display = 'block'; setTimeout(() => { window.location.href='games.html' }, 2000);">
      &#128181; PLAY GAME ->
    </button>
  
    <!-- Loader Element -->
    <div id="loader1" class="loader"></div>
    
  </div>
  
<script>
  
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => {
          console.log('Service Worker registered successfully:', reg.scope);
        })
        .catch((err) => {
          console.log('Service Worker registration failed:', err);
        });
    });
  }
  </script>
</body>
</html>
